name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  sidecars:
    name: sidecars (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: npm run setup:sidecars
      - name: Sidecar files exist
        shell: bash
        run: |
          ls -la src-tauri/binaries
          shopt -s nullglob
          ffmpeg=(src-tauri/binaries/ffmpeg-*)
          ffprobe=(src-tauri/binaries/ffprobe-*)
          test "${#ffmpeg[@]}" -ge 1
          test "${#ffprobe[@]}" -ge 1

  sidecars-release:
    name: sidecars-release (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/video-rs-sidecars
          key: sidecars-${{ hashFiles('scripts/sidecar-lock.json') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Portable static sidecars
        env:
          VIDEO_RS_SIDECAR_CACHE: ${{ runner.temp }}/video-rs-sidecars
        run: npm run setup:sidecars -- --release
      - name: Static ffmpeg responds
        run: |
          bin=(src-tauri/binaries/ffmpeg-*)
          probe=(src-tauri/binaries/ffprobe-*)
          test -f "${bin[0]}" && test ! -L "${bin[0]}"
          "${bin[0]}" -hide_banner -version
          "${probe[0]}" -hide_banner -version

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Real-file smoke
        env:
          VIDEO_RS_SMOKE: "1"
        run: cargo test smoke:: -- --test-threads=1 --nocapture
