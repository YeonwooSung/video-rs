name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Test
        run: cargo test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  sidecars:
    name: sidecars (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: npm run setup:sidecars
      - name: Sidecar files exist
        shell: bash
        run: |
          ls -la src-tauri/binaries
          shopt -s nullglob
          ffmpeg=(src-tauri/binaries/ffmpeg-*)
          ffprobe=(src-tauri/binaries/ffprobe-*)
          test "${#ffmpeg[@]}" -ge 1
          test "${#ffprobe[@]}" -ge 1
