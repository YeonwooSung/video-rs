[workspace]
members = [
    "crates/video-core",
    "crates/video-ffprobe",
    "crates/video-ffmpeg",
    "crates/video-audio",
    "crates/video-transcribe",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["YeonwooSung"]

[workspace.dependencies]
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
video-core = { path = "crates/video-core" }
video-ffmpeg = { path = "crates/video-ffmpeg" }
